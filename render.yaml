# Render Blueprint (#12, NFR-13). Design: docs/architecture.md §6.1.
# One web service with a persistent disk for the SQLite file. Create it once from the
# Render dashboard (New → Blueprint → this repository); after that, main deploys
# itself when CI passes.
services:
  - type: web
    name: chess-tutor
    runtime: node
    plan: starter # free instances can't attach a disk
    numInstances: 1 # a disk allows only one instance
    # The full WASM Stockfish peaks at ~760-850 MB, over Starter's 512 MB, so the deploy runs the
    # official native Stockfish 19 (same version as the pinned npm package), pinned by checksum.
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm --filter @chess-tutor/web build &&
      curl -fsSL -o /tmp/stockfish.tar.gz https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz &&
      echo "9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f  /tmp/stockfish.tar.gz" | sha256sum -c - &&
      mkdir -p .stockfish &&
      tar -xzf /tmp/stockfish.tar.gz -C .stockfish --strip-components=1 stockfish/stockfish-linux-x86-64-universal
    startCommand: pnpm --filter @chess-tutor/server start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    disk:
      name: chess-tutor-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /var/data/chess-tutor.sqlite
      - key: WEB_DIST
        value: apps/web/dist
      - key: STOCKFISH_PATH
        value: /opt/render/project/src/.stockfish/stockfish-linux-x86-64-universal
      # Secrets: set in the Render dashboard, never in this file (NFR-12).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LICHESS_TOKEN
        sync: false
